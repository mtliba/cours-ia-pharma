W.verdict=el=>{const O=[["inst","Installer"],["cond","Installer sous conditions"],["ref","Refuser"]],FB={inst:"Installer sans condition revient à ignorer trois lignes de la fiche : 60 % de sensibilité après 65 ans, des chiffres surestimés au CHU B, une supervision à organiser.",cond:"C'est la décision proposée en correction. Vérifiez que chacune de vos conditions peut être contrôlée par le service.",ref:"Défendable, si le service ne peut pas tenir les conditions de la correction. Dites-le explicitement au chef de service."};
 el.innerHTML=`<fieldset class="rad"><legend class="lbl">Votre décision</legend>${O.map(o=>`<label><input type="radio" name="vd" value="${o[0]}">${o[1]}</label>`).join("")}</fieldset><label class="lbl" for="vd-t">Vos trois conditions, ou vos raisons</label><textarea id="vd-t" placeholder="Écrivez ici avant de comparer."></textarea><button type="button" class="btn" data-go>Comparer avec la correction</button><p class="say" aria-live="polite"></p>`;
 $("[data-go]",el).onclick=()=>{const c=$("input[name=vd]:checked",el);$(".say",el).textContent=fr(c?FB[c.value]+" Ouvrez ensuite la correction.":"Choisissez d'abord une décision.");};};

/* ---------- Diapositives : lecteur pas à pas, chaque deck isolé dans son propre arbre ---------- */
const DECKS=new Map(),POS=new Map();let DECKCSS=null;
const BASE=`*{margin:0}.root>section{width:1920px!important;height:1080px!important;overflow:hidden!important;box-sizing:border-box!important;position:relative;isolation:isolate}aside,noscript{display:none!important}h1{font-size:96px;font-weight:600}h2{font-size:64px;font-weight:600}h3{font-size:44px;font-weight:600}p,li,h1,h2,h3{overflow-wrap:break-word;text-wrap:pretty}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important;transition-delay:0ms!important}}`;
const getText=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.text();});
async function loadDeck(n){if(DECKS.has(n))return DECKS.get(n);if(DECKCSS===null)DECKCSS=await getText("decks/deck.css");const d=JSON.parse(await getText(`decks/seance${n}.json`));DECKS.set(n,d);return d;}
W.deck=el=>{
 const n=+el.dataset.n;
 el.innerHTML=`<div class="player" tabindex="0" role="region" aria-roledescription="diaporama" aria-label="Diapositives de la séance ${n}"><div class="stage"><div class="host"></div><p class="dk-msg">Chargement des diapositives…</p></div><div class="dk-prog" aria-hidden="true"><span></span></div>
 <div class="dk-ctl"><button type="button" class="btn ghost" data-dk="prev">Précédent</button><button type="button" class="btn" data-dk="next">Suivant</button><p class="dk-pos" aria-live="polite"></p><select class="dk-sel" aria-label="Aller à une diapositive"></select><button type="button" class="btn ghost" data-dk="notes" aria-pressed="false">Texte de la vidéo</button><button type="button" class="btn ghost" data-dk="fs">Plein écran</button></div>
 <div class="dk-notes" hidden><p class="k">Texte de la vidéo</p><p class="dk-nt"></p></div></div>
 <p class="cap">Cliquez sur la diapositive, ou utilisez les flèches du clavier, pour avancer étape par étape.</p>`;
 const P=$(".player",el),stage=$(".stage",el),host=$(".host",el),sel=$(".dk-sel",el),fsb=$('[data-dk="fs"]',el),sh=host.attachShadow({mode:"open"});
 let deck=null,root=null,i=0,s=0,idx=[];
 const isFs=()=>document.fullscreenElement===P||P.classList.contains("fsx");
 const fit=()=>{const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;const k=Math.min(w/1920,h/1080);host.style.transform=`translate(${(w-1920*k)/2}px,${(h-1080*k)/2}px) scale(${k})`;fsb.textContent=isFs()?"Quitter le plein écran":"Plein écran";};
 if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);else window.addEventListener("resize",fit);
 const upd=()=>{const N=deck.slides.length;$(".dk-pos",el).textContent=fr(`Diapositive ${i+1} sur ${N}`+(idx.length?`, étape ${s} sur ${idx.length}`:""));
  $(".dk-prog span",el).style.width=`${(i+(idx.length?s/idx.length:1))/N*100}%`;sel.value=String(i);
  $(".dk-nt",el).textContent=deck.slides[i].notes||"Pas de texte pour cette diapositive.";
  $('[data-dk="prev"]',el).disabled=i===0&&s===0;$('[data-dk="next"]',el).disabled=i===N-1&&s===idx.length;};
 const apply=()=>{const thr=s?idx[s-1]:-Infinity;root.querySelectorAll(".fragment").forEach(f=>f.classList.toggle("visible",(+f.dataset.fragmentIndex||0)<=thr));upd();};
 const show=(j,atEnd)=>{i=Math.max(0,Math.min(deck.slides.length-1,j));root.innerHTML=deck.slides[i].html;const sec=root.firstElementChild;if(sec)sec.style.counterReset=`page ${i}`;
  idx=[...new Set([...root.querySelectorAll(".fragment")].map(f=>+f.dataset.fragmentIndex||0))].sort((a,b)=>a-b);s=atEnd?idx.length:0;apply();POS.set(n,i);};
 const next=()=>{if(!deck)return;if(s<idx.length){s++;apply();}else if(i<deck.slides.length-1)show(i+1,false);};
 const prev=()=>{if(!deck)return;if(s>0){s--;apply();}else if(i>0)show(i-1,true);};
 stage.addEventListener("click",()=>{P.focus({preventScroll:true});next();});
 $('[data-dk="next"]',el).onclick=next;$('[data-dk="prev"]',el).onclick=prev;
 sel.onchange=()=>{if(deck)show(+sel.value,false);};
 $('[data-dk="notes"]',el).onclick=e=>{const b=e.currentTarget,box=$(".dk-notes",el),on=box.hidden;box.hidden=!on;b.setAttribute("aria-pressed",String(on));b.textContent=on?"Masquer le texte":"Texte de la vidéo";};
 fsb.onclick=()=>{if(document.fullscreenElement===P){document.exitFullscreen().catch(()=>{});return;}if(P.classList.contains("fsx")){P.classList.remove("fsx");fit();return;}
  const fall=()=>{P.classList.add("fsx");fit();};try{const r=P.requestFullscreen?P.requestFullscreen():null;if(r&&r.catch)r.catch(fall);else if(!r)fall();}catch(err){fall();}P.focus({preventScroll:true});};
 P.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;const N=deck?deck.slides.length:0;
  if(e.key==="ArrowRight"||e.key==="PageDown"||(e.key===" "&&e.target===P)){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
  else if(e.key==="Home"&&deck){e.preventDefault();show(0,false);}else if(e.key==="End"&&deck){e.preventDefault();show(N-1,true);}
  else if(e.key==="Escape"&&P.classList.contains("fsx")){P.classList.remove("fsx");fit();}});
 loadDeck(n).then(d=>{deck=d;sh.innerHTML=`<style>${BASE}${DECKCSS}</style><div class="root"></div>`;root=sh.querySelector(".root");
  sel.innerHTML=d.sections.map((sc,k)=>{const end=k+1<d.sections.length?d.sections[k+1].start:d.slides.length;return `<optgroup label="${sc.label.replace(/"/g,"")}">${d.slides.slice(sc.start,end).map((sl,j)=>`<option value="${sc.start+j}">${sc.start+j+1}. ${sl.title.replace(/</g,"&lt;")}</option>`).join("")}</optgroup>`;}).join("");
  $(".dk-msg",el).remove();show(POS.get(n)||0,false);fit();})
 .catch(()=>{$(".dk-msg",el).textContent=fr("Les diapositives n'ont pas pu être chargées. Rechargez la page.");});
};

/* ---------- Routage et interactions ---------- */
const SEANCES=[s1,s2,s3,s4,s5,s6,s7],VIEWS={accueil:home,fiche:ficheView};SEANCES.forEach((f,i)=>VIEWS["seance-"+(i+1)]=f);
function route(first){
 const h=decodeURIComponent(location.hash.slice(1)),v=VIEWS[h]?h:"accueil",m=$("#main");RID=0;
 m.innerHTML=VIEWS[v]();
 $$("[data-w]",m).forEach(e=>{if(W[e.dataset.w])W[e.dataset.w](e);});
 $$(".fiche",m).forEach(e=>fiche(e,+e.dataset.cur));
 typo(m);
 $$(".nav a").forEach(a=>a.removeAttribute("aria-current"));const cur=$(`.nav a[href="#${v}"]`);if(cur)cur.setAttribute("aria-current","page");
 document.title=v==="accueil"?"IA responsable et santé numérique":v==="fiche"?"Fiche d’évaluation, IA responsable et santé numérique":`Séance ${v.slice(7)}, IA responsable et santé numérique`;
 if(!first){window.scrollTo(0,0);const h1=$("h1",m);if(h1)h1.focus({preventScroll:true});}
}
document.addEventListener("click",e=>{
 const r=e.target.closest(".rv");
 if(r){const box=document.getElementById(r.getAttribute("aria-controls")),open=r.getAttribute("aria-expanded")!=="true";r.setAttribute("aria-expanded",String(open));box.hidden=!open;box.classList.toggle("open",open);r.textContent=fr(open?(r.dataset.l==="Voir la correction"?"Masquer la correction":"Masquer"):r.dataset.l);return;}
 const o=e.target.closest(".opt");
 if(o){const qi=o.closest(".qi");if(qi.classList.contains("done"))return;qi.classList.add("done");const a=+qi.dataset.ans,j=+o.dataset.j;
  $$(".opt",qi).forEach(x=>{x.disabled=true;if(+x.dataset.j===a){x.classList.add("ok");$(".tag",x).textContent="Bonne réponse";}});
  if(j!==a){o.classList.add("ko");$(".tag",o).textContent="Votre réponse";}
  const wy=$(".why",qi);wy.hidden=false;wy.insertAdjacentHTML("afterbegin",`<b>${j===a?"Juste.":"Pas tout à fait."}</b> `);typo(wy);return;}
 const f=e.target.closest("[data-fill]");
 if(f){const n=+f.dataset.fill;done.add(n);save();const fe=f.parentElement.querySelector(".fiche");if(fe)fiche(fe,n,n);return;}
 if(e.target.closest("[data-fillall]")){for(let i=1;i<=7;i++)done.add(i);save();fiche($(".fiche"),0,"all");return;}
 if(e.target.closest("[data-clear]")){done.clear();save();fiche($(".fiche"),0);return;}
});
window.addEventListener("hashchange",()=>route(false));
route(true);
</script>
