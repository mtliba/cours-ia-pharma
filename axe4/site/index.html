<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA responsable et santé numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Papier blanc et encre bleu nuit, comme les vidéos. Le bleu montre et se manipule ; le rouge signale l'événement ou l'erreur.
     L'écriture manuscrite est réservée à ce que l'on ajoute pendant le cours : corrections, fiche d'évaluation.
     Mise en page : une colonne de lecture d'environ 70 caractères, des figures plus larges, une barre des séances en haut. */
  --paper:#FFFFFF; --ink:#101B3F; --muted:#5A6379; --quiet:#7F88A0; --line:#D9DDE6; --soft:#E6E9F0;
  --blue:#2A46C8; --blue-pale:#E9EDFB; --tint:#F3F5FD;
  --red:#D22B3A; --red-pale:#FBE6E8; --red-mid:#EE9CA4;
  --sans:'Source Sans 3','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 18px/1.55 var(--sans)}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance}
h1{font-weight:900;font-size:clamp(36px,5.2vw,58px);line-height:1.04;letter-spacing:-.02em;margin:6px 0 16px}
h1:focus{outline:none}
h2{font-weight:900;font-size:30px;line-height:1.15;letter-spacing:-.01em;margin:68px 0 14px}
h3{font-weight:700;font-size:22px;line-height:1.25;margin:36px 0 10px}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px}
b{font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 4px}
.mut{color:var(--muted)}
.lead{font-size:21px;line-height:1.45;color:var(--muted);max-width:760px}
.cap{font-size:15px;color:var(--muted);margin:8px 0 14px}
.real{font-size:15px;font-weight:700;color:var(--blue);margin:34px 0 0}
.real + h3{margin-top:4px}

/* Barre des séances */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:6px 24px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);text-decoration:none;font-size:17px;margin-right:auto;padding:8px 0}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.nav a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:44px;padding:0 10px;color:var(--muted);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}

main{max-width:1120px;margin:0 auto;padding:36px 24px 96px}
.page > section, .page > p, .page > .situ{max-width:900px}
.page > section > p, .page > section > ul, .page > section > ol, .page > section > h3{max-width:720px}

/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center;padding:8px 0 40px;border-bottom:2px solid var(--ink);max-width:none !important}
.hero .by{font-weight:700;margin:4px 0 22px}
.herofig{margin:0}
.herofig svg{width:100%;max-width:360px;margin-left:auto}
.herofig .cap{max-width:360px;margin-left:auto}
.hd{fill:var(--soft)}
.hd.ev{animation:ev .6s ease var(--d) forwards}
@keyframes ev{to{fill:var(--red)}}
.srows{border-top:2px solid var(--ink)}
.srow{display:grid;grid-template-columns:52px minmax(0,1.1fr) minmax(0,1fr) 150px;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.srow:hover .st{color:var(--blue)}
.sn{font-size:32px;font-weight:900;color:var(--blue);line-height:1}
.st{font-size:21px;font-weight:700;line-height:1.25}
.sq{color:var(--muted);font-size:17px}
.sd{font-family:var(--hand);font-weight:700;font-size:26px;line-height:1;color:var(--blue);text-align:right}

/* Situation de départ */
.situ{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px;margin:30px 0 8px;padding:26px 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.situ p{font-size:19px}
.qz-big{font-size:28px;line-height:1.2;font-weight:900;color:var(--blue);text-wrap:balance}
.qz-big::after{content:"";display:block;width:110px;height:6px;border-radius:3px;background:var(--red);margin-top:16px}

.stmt{font-size:28px;line-height:1.25;font-weight:900;max-width:820px;margin:34px 0 18px;text-wrap:balance}
.stmt::after{content:"";display:block;width:120px;height:6px;border-radius:3px;background:var(--red);margin-top:14px}

/* Listes */
.dots-list{padding-left:20px}
.dots-list li{margin:6px 0}
.dots-list li::marker{color:var(--blue)}
.num-list{padding-left:24px}
.num-list li{margin:8px 0}
.num-list li::marker{color:var(--blue);font-weight:900}

/* Tableaux */
.scroll{overflow-x:auto;margin:14px 0 16px}
.tb{width:100%;border-collapse:collapse;font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums}
.tb th,.tb td{text-align:left;vertical-align:top;padding:11px 18px 11px 0;border-top:1px solid var(--line)}
.tb thead th{font-size:14px;font-weight:700;color:var(--muted);border-top:0;border-bottom:2px solid var(--ink);padding-bottom:8px}
.tb tbody th{font-weight:700}
.tb tr.hl th,.tb tr.hl td{background:var(--blue-pale)}
.tb tr.hl th{padding-left:10px}

/* Colonnes, étapes, grands nombres */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 34px;margin:14px 0 18px}
.cols > div{border-top:2px solid var(--ink);padding-top:10px}
.cols h3{margin:0 0 6px;font-size:20px}
.cols p{font-size:17px;margin:0}
.flow{list-style:none;padding:0;margin:18px 0 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;counter-reset:f;max-width:none !important}
.flow li{counter-increment:f;display:flex;flex-direction:column;gap:4px;position:relative;padding-top:52px}
.flow li::before{content:counter(f);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;display:grid;place-items:center}
.flow li::after{content:"";position:absolute;top:19px;left:50px;right:-8px;height:2px;background:var(--blue)}
.flow li:last-child::after{display:none}
.flow b{font-size:19px}
.flow span{font-size:16px;line-height:1.45}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px 34px;margin:16px 0 6px}
.bn{font-size:54px;font-weight:900;line-height:1;letter-spacing:-.02em;color:var(--blue);margin:0 0 6px;font-variant-numeric:tabular-nums}
.bn.w{color:var(--red)}
.bl{font-size:16px;margin:0}
.hbars{display:grid;gap:12px;margin:16px 0 8px;max-width:760px}
.hb{display:grid;grid-template-columns:210px minmax(0,1fr) 56px;gap:14px;align-items:center}
.hb-l{text-align:right;font-size:16px}
.hb-t{height:24px;background:var(--soft);border-radius:0 4px 4px 0}
.hb-f{display:block;height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.hb-f.w{background:var(--red)}
.hb-v{font-weight:900;font-variant-numeric:tabular-nums}

/* Figures et commandes */
.fig{margin:22px 0 24px;padding-top:18px;border-top:1px solid var(--line);max-width:960px}
.fig-t{font-weight:700;font-size:19px;margin:0 0 6px;line-height:1.3}
.fig.sub{border-top:0;padding-top:4px;margin-top:26px}
svg{display:block;max-width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans)}
.tk{font-size:14px;fill:var(--muted)}
.ax{font-size:14px;font-weight:700;fill:var(--ink)}
.lb{font-size:16px;font-weight:700;fill:var(--ink)}
.gl{stroke:var(--line);stroke-width:1}
.ref{stroke:var(--quiet);stroke-width:1.5;stroke-dasharray:5 5}
.dg{stroke:var(--quiet);stroke-width:2;stroke-dasharray:8 7}
.ctl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;margin:10px 0 16px}
.grp{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg{font:inherit;font-size:16px;font-weight:600;background:var(--paper);color:var(--ink);border:0;border-left:1.5px solid var(--line);padding:8px 14px;min-height:42px;cursor:pointer}
.seg:first-child{border-left:0}
.seg:hover{background:var(--blue-pale)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.sm{font-size:15px;padding:6px 12px;min-height:38px}
.btn{font:inherit;font-size:16px;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:var(--paper);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.btn:disabled{opacity:.4;cursor:default}
.chip{font:inherit;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:38px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-pale)}
.presets{display:flex;gap:8px;flex-wrap:wrap}
input[type=range]{width:min(380px,100%);accent-color:var(--blue);margin:8px 0 0}
.lbl{font-size:16px;font-weight:700;margin:0;display:block}
output{font-variant-numeric:tabular-nums;color:var(--blue)}
.say{font-size:17px;font-weight:600;margin:10px 0 0;max-width:760px}
.sw{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;margin:0 6px 0 12px}
.sw:first-child{margin-left:0}
.sw-r{background:var(--red)}
.sw-ring{box-shadow:inset 0 0 0 3px var(--ink)}
.sw-b{background:var(--blue)}
.sw-o{box-shadow:inset 0 0 0 3px var(--ink);background:var(--paper)}

/* Simulateur */
.sim{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
.dt{transition:fill .45s ease,stroke .45s ease}
.mx{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;gap:6px;font-variant-numeric:tabular-nums}
.mx .h{font-size:14px;font-weight:700;color:var(--muted);align-self:end;padding-bottom:2px}
.mx .rh{font-weight:700;font-size:15px;align-self:center;padding-right:6px}
.mx .c{background:var(--blue-pale);padding:10px 14px;border-radius:6px}
.mx .c.e{background:var(--red-pale)}
.mx .n{font-size:32px;font-weight:900;line-height:1.05;display:block}
.mx .l{font-size:14px}
.mx .t{font-size:19px;font-weight:700;color:var(--muted);align-self:center;padding:0 8px}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;margin:18px 0 0}
.meas div{border-top:2px solid var(--ink);padding-top:6px}
.meas dt{font-size:14px;font-weight:700;color:var(--muted)}
.meas dd{margin:0;font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.meas .vpp dd{color:var(--blue)}
.meas .mute dd{color:var(--quiet)}
.cv-l{fill:none;stroke:var(--blue);stroke-width:3}
.cv-p{fill:var(--blue);stroke:var(--paper);stroke-width:3}
.cv-t{font-size:16px;font-weight:900;fill:var(--blue);paint-order:stroke;stroke:var(--paper);stroke-width:6px;stroke-linejoin:round}

/* Exercices */
.exo{background:var(--tint);border-radius:12px;padding:24px 28px;margin:30px 0;max-width:900px}
.exo h3{margin:2px 0 12px}
.exo-k{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);margin:0}
.pz{display:inline-flex;gap:4px}
.pz i{width:5px;height:16px;background:var(--blue);display:block}
.steps{margin:0 0 12px;padding-left:24px}
.steps li{margin:5px 0}
.exo-m{font-size:15px;color:var(--muted)}
.rv{font:inherit;font-weight:700;font-size:16px;color:var(--blue);background:none;border:0;padding:8px 0;cursor:pointer;display:inline-flex;gap:10px;align-items:center;min-height:40px}
.rv::before{content:"";width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.rv[aria-expanded="true"]::before{transform:rotate(45deg)}
.corr{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.corr.open{animation:fade .35s ease}
.hand{font-family:var(--hand);font-weight:700;font-size:36px;line-height:1;color:var(--red);margin:0 0 8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.doc{background:#F5F6F9;border:1px solid var(--line);border-radius:8px;padding:18px 22px;margin:14px 0 18px;max-width:760px}
.doc p:last-child{margin:0}
.exo .doc{background:var(--paper)}
textarea{font:inherit;font-size:17px;width:100%;min-height:120px;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;margin:6px 0 10px;background:var(--paper);color:var(--ink)}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 16px;margin:12px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700}
.inp{font:inherit;font-size:18px;width:100%;max-width:170px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums;background:var(--paper);color:var(--ink)}
.inp.ok{border-color:var(--blue);background:var(--blue-pale)}
.inp.ko{border-color:var(--red);background:var(--red-pale)}

/* Listes à choisir */
.sort{list-style:none;padding:0;margin:8px 0 6px}
.sort li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sort .fb{grid-column:1/-1;font-size:15px;font-weight:600;margin:0}
.sort .fb:empty{display:none}
.sort li.ok .fb{color:var(--blue)}
.sort li.ko .fb{color:var(--red)}
.sort li.ok .seg[aria-pressed="true"]{background:var(--blue)}
.sort li.ko .seg[aria-pressed="true"]{background:var(--red)}

/* Questions */
.poll{margin:22px 0 26px;padding:18px 0 4px;border-top:2px solid var(--ink);max-width:760px}
.qz ol{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:28px;max-width:760px}
.qq{font-weight:700;font-size:19px;margin:0 0 10px}
.qo{display:grid;gap:8px}
.opt{font:inherit;font-size:17px;text-align:left;display:flex;gap:12px;align-items:baseline;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .ol{font-weight:900;color:var(--blue);min-width:16px}
.opt .tag{margin-left:auto;font-size:14px;font-weight:700;white-space:nowrap}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{border-color:var(--blue);background:var(--blue-pale)}
.opt.ok .tag{color:var(--blue)}
.opt.ko{border-color:var(--red);background:var(--red-pale)}
.opt.ko .tag{color:var(--red)}
.why{font-size:16px;margin:10px 0 0;animation:fade .3s ease}

/* Phrases entendues */
.cmp{list-style:none;padding:0;margin:10px 0 0;max-width:900px !important}
.cmp li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.cmp q{quotes:none;color:var(--muted);font-size:17px}
.cmp .rv{padding-top:0;min-height:0}
.cmp .corr{border:0;padding:4px 0 0;margin:0}
.cmp .ans{font-weight:700;margin:0}

/* À retenir, fiche, sources, pagination */
.ret ul{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink);max-width:760px}
.ret li{font-size:20px;font-weight:700;padding:13px 0;border-bottom:1px solid var(--line)}
.next{margin-top:16px;font-size:17px}
.fi{border-top:2px solid var(--ink);margin:12px 0 16px;max-width:980px}
.fi-r{display:grid;grid-template-columns:210px minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:58px}
.fi-r.cur{background:var(--blue-pale);padding-left:10px;padding-right:10px}
.fi-h{min-height:0;font-size:14px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--ink);padding:8px 0}
.fi-a{font-weight:700}
.fi-b{font-size:16px;color:var(--muted)}
.fi-c{font-family:var(--hand);font-weight:700;font-size:28px;line-height:1.05;color:var(--blue)}
.fi-c.write{animation:write 1.1s ease-out both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.fi-e{height:24px;border-bottom:2px dotted #AEB5C6}
.src ul{padding-left:20px;font-size:15px;color:var(--muted);max-width:820px}
.src li{margin:6px 0}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:60px;padding-top:18px;border-top:2px solid var(--ink);flex-wrap:wrap}
.pager a{font-weight:700;text-decoration:none;max-width:48%}
.pager .nx{margin-left:auto;text-align:right}

/* Figures particulières */
.lk{fill:var(--blue);stroke:var(--blue);stroke-width:3;transition:fill .5s ease,stroke .5s ease}
.lk.test{fill:var(--paper);stroke:var(--ink)}
.rg{fill:var(--blue)}
.rg.miss{fill:var(--paper);stroke:var(--red);stroke-width:3}
.ready .rg{transition-property:transform;transition-duration:.8s;transition-timing-function:cubic-bezier(.3,.7,.2,1)}
.lab-all,.lab-age{transition:opacity .4s ease}
.lab-age{opacity:0}
.m-age .lab-age{opacity:1}
.m-age .lab-all{opacity:0}
.wh-b,.wh-r{stroke-width:4;stroke-linecap:round}
.wh-b{stroke:var(--blue)}
.wh-r{stroke:var(--red)}
.pt-b{fill:var(--blue);stroke:var(--paper);stroke-width:3}
.pt-r{fill:var(--red);stroke:var(--paper);stroke-width:3}
.cal{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:34px;align-items:start}
.cl{fill:none;stroke:var(--blue);stroke-width:2.5;transition:opacity .25s}
.cl.mv{opacity:0}
.cp{fill:var(--blue);stroke:var(--paper);stroke-width:3;cursor:pointer}
.cp.sel{stroke:var(--ink);stroke-width:3.5}
.ready .cp{transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.cpt{fill:var(--blue);stroke:var(--paper);stroke-width:3}
.bins{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.minis{display:flex;gap:28px;margin-top:14px}
.minis figure{margin:0}
.mini{width:130px}
.mini .mo{fill:var(--soft)}
.mini .ma{fill:var(--quiet)}
.mini .mob{fill:var(--blue)}
.wh{transform:scaleX(0);transform-box:view-box;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.on .wh{transform:scaleX(1)}
.band{fill:var(--blue-pale)}
.tok{font-size:20px;line-height:2.3;margin:4px 0 8px}
.tk-c{display:inline-block;border:1.5px solid var(--ink);border-radius:4px;padding:0 8px;line-height:1.6;margin-right:3px}
.slot{display:inline-block;min-width:140px;text-align:center;border-bottom:3px dashed var(--ink);font-weight:700;line-height:1.6;margin:0 6px 0 3px}
.slot.ok{color:var(--blue);border-bottom:3px solid var(--blue)}
.slot.ko{color:var(--red);border-bottom:3px solid var(--red)}
.gbars{display:grid;gap:8px;margin:14px 0 4px;max-width:640px}
.gb{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:12px;align-items:center}
.gn{font-weight:600;text-align:right}
.gt{height:20px;background:var(--soft);border-radius:0 4px 4px 0;overflow:hidden}
.gf{display:block;height:100%;width:0;transition:width .45s ease}
.gf.ok{background:var(--blue)}
.gf.ko{background:var(--red)}
.gv{font-weight:700;font-variant-numeric:tabular-nums}
.reid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:34px;align-items:center}
.rd{fill:var(--quiet);transition:fill .5s ease}
.s1 .rd,.s2 .rd{fill:var(--soft)}
.s1 .rd.y{fill:var(--blue)}
.s2 .rd.me{fill:var(--red)}
.cnt{font-size:76px;font-weight:900;line-height:1;color:var(--blue);margin:0;font-variant-numeric:tabular-nums}
.s2 .cnt{color:var(--red)}
.cnt-l{font-size:18px;font-weight:700;margin:4px 0 14px}
.pyr{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:34px;align-items:center}
.pl{cursor:pointer}
.pl polygon{stroke:var(--paper);stroke-width:3}
.pl.on polygon{stroke:var(--ink);stroke-width:3.5}
.pl text{font-size:17px;font-weight:700;pointer-events:none}
.pyr-t{font-size:24px;font-weight:900;margin:0 0 6px}
.ln{stroke:var(--ink);stroke-width:3}
.ev-p{fill:var(--blue)}
.ev-f{fill:var(--paper);stroke:var(--blue);stroke-width:4}
.td{font-size:16px;font-weight:700;fill:var(--ink)}
.tt{font-size:15px;fill:var(--ink)}
.today{stroke:var(--red);stroke-width:2;stroke-dasharray:4 4}
.rad{border:0;padding:0;margin:8px 0 14px;display:grid;gap:8px}
.rad label{display:flex;gap:10px;align-items:center;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;max-width:420px}
.rad input{accent-color:var(--blue);width:18px;height:18px}

/* Diapositives de la séance */
.deckwrap{max-width:960px;margin:26px 0 10px}
.player{outline:none}
.player:focus-visible .stage{box-shadow:0 0 0 3px var(--blue)}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.host{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.dk-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600;margin:0}
.dk-prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin-top:10px}
.dk-prog span{display:block;height:100%;width:0;background:var(--blue);transition:width .3s ease}
.dk-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.dk-ctl .btn{padding:8px 14px;font-size:15px}
.dk-pos{flex:1;min-width:140px;margin:0;font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.dk-sel{font:inherit;font-size:15px;max-width:230px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-height:44px}
.dk-notes{margin-top:12px;padding:14px 18px;background:#F5F6F9;border:1px solid var(--line);border-radius:8px}
.dk-nt{margin:0;font-size:17px}
.player:fullscreen,.player.fsx{background:var(--ink);padding:16px 24px;display:flex;flex-direction:column;justify-content:center}
.player.fsx{position:fixed;inset:0;z-index:100}
.player:fullscreen .stage,.player.fsx .stage{flex:1;aspect-ratio:auto;border:0;border-radius:0;background:transparent}
.player:fullscreen .dk-pos,.player.fsx .dk-pos{color:#C3CCF3}
.player:fullscreen .btn.ghost,.player.fsx .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #C3CCF3}
.player:fullscreen .dk-notes,.player.fsx .dk-notes{max-height:22vh;overflow:auto}

<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#accueil">IA responsable et santé numérique</a>
    <nav class="nav" aria-label="Séances">
      <a href="#seance-1" aria-label="Séance 1">1</a><a href="#seance-2" aria-label="Séance 2">2</a><a href="#seance-3" aria-label="Séance 3">3</a><a href="#seance-4" aria-label="Séance 4">4</a><a href="#seance-5" aria-label="Séance 5">5</a><a href="#seance-6" aria-label="Séance 6">6</a><a href="#seance-7" aria-label="Séance 7">7</a><a href="#fiche">Fiche</a>
    </nav>
  </div>
</header>
<main id="main"><noscript><p>Ce support a besoin de JavaScript pour afficher les séances.</p></noscript></main>
<script>
"use strict";
const NB=" ";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const fr=s=>String(s).replace(/'/g,"’").replace(/ ([:;?!»%])/g,NB+"$1").replace(/« /g,"«"+NB).replace(/(\d) (\d{3})(?!\d)/g,"$1"+NB+"$2");
const nf=x=>Math.round(x).toLocaleString("fr-FR").replace(/\s/g,NB);
const pc=(x,d=0)=>(100*x).toFixed(d).replace(".",",")+NB+"%";
function typo(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(n=>{const p=n.parentElement;if(!p||p.closest("script,style,textarea"))return;const t=fr(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;});}

const T=["Lire une étude d'IA en santé","Mesurer la performance","Biais et équité","Incertitude et calibration","IA générative et information sur le médicament","Données de santé et cadre réglementaire","Supervision humaine et responsabilité"];
const GRID=[["Question et données","Que prédit-il, pour qui, avec quoi ?","AUC 0,78 sans fuite ; 0,71 dans un autre CHU"],["Performance","Quelles erreurs, au seuil choisi ?","Seuil 30 % : sensibilité 80 %, VPP 44 %"],["Équité","Fonctionne-t-il aussi bien pour tous ?","Sensibilité 60 % après 65 ans, 91 % avant"],["Calibration","Ses probabilités sont-elles justes ?","Annonce 27 % en moyenne, 20 % observés"],["Texte généré","Le texte produit est-il vérifié ?","Relecture par un pharmacien avant remise"],["Données et cadre","Données protégées, outil conforme ?","Dispositif médical : marquage CE à vérifier"],["Supervision","Qui décide, qui trace, qui répond ?","Le pharmacien vérifie, le médecin décide"]];

/* Lignes de fiche déjà remplies : commodité propre à ce navigateur. */
const done=new Set();
try{JSON.parse(localStorage.getItem("iars-fiche")||"[]").forEach(n=>done.add(n));}catch(e){}
const save=()=>{try{localStorage.setItem("iars-fiche",JSON.stringify([...done]));}catch(e){}};

/* ---------- Gabarits ---------- */
let RID=0;
const tb=(head,rows,o={})=>`<div class="scroll"><table class="tb"><thead><tr>${head.map(h=>`<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr${o.hl===i?' class="hl"':""}>${r.map((c,j)=>j?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const nums=(items,src)=>`<div class="nums">${items.map(([b,l,w])=>`<div><p class="bn${w?" w":""}">${b}</p><p class="bl">${l}</p></div>`).join("")}</div>${src?`<p class="cap">${src}</p>`:""}`;
const cols=items=>`<div class="cols">${items.map(([h,t])=>`<div><h3>${h}</h3><p>${t}</p></div>`).join("")}</div>`;
const steps=items=>`<ol class="flow">${items.map(([h,t])=>`<li><b>${h}</b><span>${t}</span></li>`).join("")}</ol>`;
const ul=items=>`<ul class="dots-list">${items.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const reveal=(label,html,cls="")=>{const id="r"+(++RID);return `<button type="button" class="rv" aria-expanded="false" aria-controls="${id}" data-l="${label}">${label}</button><div class="corr ${cls}" id="${id}" hidden>${html}</div>`;};
const qitem=(q,opts,a,why)=>`<div class="qi" data-ans="${a}"><p class="qq">${q}</p><div class="qo">${opts.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span class="ol">${"ABC"[j]}</span><span>${o}</span><span class="tag"></span></button>`).join("")}</div><p class="why" hidden>${why}</p></div>`;
const poll=(q,opts,a,why)=>`<div class="poll"><p class="k">Votre avis d'abord</p>${qitem(q,opts,a,why)}</div>`;
const quiz=items=>`<section class="qz"><h2>Pour vérifier</h2><p>Répondez, puis lisez l'explication.</p><ol>${items.map((it,k)=>`<li>${qitem(`${k+1}. ${it[0]}`,it[1],it[2],it[3])}</li>`).join("")}</ol></section>`;
const exo=o=>`<section class="exo"><p class="exo-k"><span class="pz" aria-hidden="true"><i></i><i></i></span>À vous</p><h3>${o.t}</h3><ol class="steps">${o.s.map(x=>`<li>${x}</li>`).join("")}</ol><p class="exo-m">Pause conseillée : ${o.d}. Matériel : ${o.m}. À produire : ${o.p}.</p>${o.w||""}${reveal("Voir la correction",`<p class="hand">Correction</p>${o.c}`)}</section>`;
const cmp=pairs=>`<section><h2>Que répondre à ces phrases ?</h2><p>Lisez la phrase, préparez votre réponse, puis comparez.</p><ul class="cmp">${pairs.map(([a,b])=>`<li><q>${a}</q><div>${reveal("Que répondre ?",`<p class="ans">${b}</p>`)}</div></li>`).join("")}</ul></section>`;
const ret=(pts,next,lab="Séance suivante",t="À retenir")=>`<section class="ret"><h2>${t}</h2><ul>${pts.map(p=>`<li>${p}</li>`).join("")}</ul><p class="next"><b>${lab} :</b> ${next}</p></section>`;
const ficheBlk=n=>`<section><h2>Votre fiche d'évaluation</h2><p>Une ligne par séance. Quand vous avez terminé celle-ci, remplissez la ligne ${n}.</p><div class="fiche" data-cur="${n}"></div><button type="button" class="btn" data-fill="${n}">Remplir la ligne ${n}</button></section>`;
const srcs=(list,note)=>`<section class="src"><h2>Sources</h2>${note?`<p class="mut">${note}</p>`:""}${list.length?`<ul>${list.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}</section>`;
const pager=n=>`<nav class="pager" aria-label="Séance précédente et suivante">${n>1?`<a href="#seance-${n-1}">Séance ${n-1} : ${T[n-2]}</a>`:`<a href="#accueil">Accueil du cours</a>`}${n<7?`<a class="nx" href="#seance-${n+1}">Séance ${n+1} : ${T[n]}</a>`:`<a class="nx" href="#fiche">La fiche complète</a>`}</nav>`;
const head=(n,lead)=>`<p class="k">Séance ${n} sur 7</p><h1 tabindex="-1">${T[n-1]}</h1><p class="lead">${lead}</p><div class="w deckwrap" data-w="deck" data-n="${n}"></div>`;
const situ=(ps,q)=>`<div class="situ"><div>${ps.map(p=>`<p>${p}</p>`).join("")}</div><div><p class="k">La question de la séance</p><p class="qz-big">${q}</p></div></div>`;
const stmt=t=>`<p class="stmt">${t}</p>`;
const real=`<p class="real">Étude publiée, chiffres réels</p>`;
const fig=(title,inner,cap)=>`<figure class="fig"><figcaption class="fig-t">${title}</figcaption>${inner}${cap?`<p class="cap">${cap}</p>`:""}</figure>`;
const w=name=>`<div class="w" data-w="${name}"></div>`;
const hbars=items=>`<div class="hbars">${items.map(([l,v,r])=>`<div class="hb"><span class="hb-l">${l}</span><span class="hb-t"><span class="hb-f${r?" w":""}" style="width:${v*100}%"></span></span><span class="hb-v">${String(v).replace(".",",")}</span></div>`).join("")}</div>`;
const L=(t,u)=>`<a href="${u}">${t}</a>`;
const SRC={
 wong:`Wong A. et al. External validation of a widely implemented proprietary sepsis prediction model in hospitalized patients. <i>JAMA Internal Medicine</i>, 2021. ${L("doi:10.1001/jamainternmed.2021.2626","https://doi.org/10.1001/jamainternmed.2021.2626")}`,
 zech:`Zech J. R. et al. Variable generalization performance of a deep learning model to detect pneumonia in chest radiographs. <i>PLoS Medicine</i>, 2018. ${L("doi:10.1371/journal.pmed.1002683","https://doi.org/10.1371/journal.pmed.1002683")}`,
 ober:`Obermeyer Z. et al. Dissecting racial bias in an algorithm used to manage the health of populations. <i>Science</i>, 2019. ${L("doi:10.1126/science.aax2342","https://doi.org/10.1126/science.aax2342")}`,
 sjod:`Sjoding M. W. et al. Racial bias in pulse oximetry measurement. <i>New England Journal of Medicine</i>, 2020. ${L("doi:10.1056/NEJMc2029240","https://doi.org/10.1056/NEJMc2029240")}`,
 bdpm:`Base de données publique des médicaments (RCP). ${L("base-donnees-publique.medicaments.gouv.fr","https://base-donnees-publique.medicaments.gouv.fr")}`,
 thes:`ANSM. Thesaurus des interactions médicamenteuses, dans sa version en vigueur.`,
 crat:`CRAT, Centre de référence sur les agents tératogènes. ${L("lecrat.fr","https://www.lecrat.fr")}`,
 rgpd:`Règlement (UE) 2016/679, règlement général sur la protection des données. ${L("EUR-Lex","https://eur-lex.europa.eu/eli/reg/2016/679/oj")}`,
 mdr:`Règlement (UE) 2017/745 relatif aux dispositifs médicaux. ${L("EUR-Lex","https://eur-lex.europa.eu/eli/reg/2017/745/oj")}`,
 aia:`Règlement (UE) 2024/1689 sur l'intelligence artificielle, modifié par le règlement (UE) 2026/1744. ${L("EUR-Lex","https://eur-lex.europa.eu/eli/reg/2024/1689/oj")}`,
 csp:`Code de la santé publique, articles L. 1110-4, L. 1111-8 et L. 4001-3.`,
 godd:`Goddard K. et al. Automation bias: a systematic review of frequency, effect mediators, and mitigators. <i>Journal of the American Medical Informatics Association</i>, 2012. ${L("doi:10.1136/amiajnl-2011-000089","https://doi.org/10.1136/amiajnl-2011-000089")}`,
 sijs:`van der Sijs H. et al. Overriding of drug safety alerts in computerized physician order entry. <i>Journal of the American Medical Informatics Association</i>, 2006. ${L("doi:10.1197/jamia.M1809","https://doi.org/10.1197/jamia.M1809")}`
};

/* ---------- Accueil ---------- */
function home(){
 const rows=T.map((t,i)=>`<a class="srow" href="#seance-${i+1}"><span class="sn">${i+1}</span><span class="st">${t}</span><span class="sq">${GRID[i][1]}</span><span class="sd">${done.has(i+1)?"ligne remplie":""}</span></a>`).join("");
 return `<div class="page"><section class="hero"><div><h1 tabindex="-1">IA responsable et santé numérique</h1><p class="lead">Un cours en sept séances pour les étudiants en pharmacie : lire une étude, mesurer une performance, repérer un biais, vérifier une réponse d'IA générative, protéger les données, superviser un outil. Ce support accompagne les vidéos : les diapositives de chaque séance, à parcourir étape par étape, les exercices corrigés et des figures à manipuler.</p><p class="by">Marouane Tliba</p><div class="ctl"><a class="btn" href="#seance-1">Commencer par la séance 1</a><a class="btn ghost" href="#fiche">Voir la fiche d'évaluation</a></div></div><figure class="herofig">${w("hero")}<figcaption class="cap">Les 1 000 visites du CHU B, un point pour 10 visites. En rouge, les 200 suivies d'une surexposition au tacrolimus.</figcaption></figure></section>
 <section><h2>Le fil rouge : TacroAlerte</h2><p>Un service de greffe rénale doit décider s'il installe TacroAlerte. À chaque visite, l'outil estime le risque que la concentration de tacrolimus soit trop élevée à la visite suivante.</p><p><b>TacroAlerte est fictif</b> : ses chiffres sont inventés pour le cours, et cohérents d'une séance à l'autre. Les études citées, elles, sont réelles. Chaque séance ajoute une ligne à la fiche d'évaluation de l'outil ; la décision se prend à la séance 7.</p></section>
 <section style="max-width:none"><h2>Les sept séances</h2><div class="srows">${rows}</div></section>
 <section><h2>Comment travailler</h2>${ul(["Regardez la vidéo, ou parcourez les diapositives en haut de chaque séance : un clic, une étape.","Faites chaque exercice avant d'ouvrir sa correction.","Répondez aux trois questions de fin de séance, puis remplissez la ligne de la fiche."])}</section></div>`;
}

/* ---------- Séance 1 ---------- */
function s1(){return `<div class="page">${head(1,"Avant de demander si un outil fonctionne : que prédit-il, pour qui, et sur quelles données a-t-il été vérifié ?")}
${situ(["Vous êtes interne à la pharmacie d'un CHU. Un éditeur présente <b>TacroAlerte</b>, un outil fictif : à chaque visite d'un patient greffé du rein, il estime le risque que sa concentration de tacrolimus soit trop élevée à la visite suivante.","La plaquette annonce : « AUC 0,86, validé sur 2 400 patients ».","Votre chef de service vous demande : « On l'installe ? »"],"Que devez-vous savoir avant de répondre ?")}
<section><h2>Quatre questions à poser à toute étude</h2>
<p>Un chiffre de performance n'a de sens que rapporté à une question précise. Avant « est-ce que ça marche ? », demandez : ça prédit quoi, pour qui, avec quoi, et quand ?</p>
${tb(["Question","Ce qu'on cherche","Pour TacroAlerte, d'après la notice"],[["Qui ? La population","Les patients inclus et exclus, le lieu, la période","Adultes greffés du rein, CHU A, 2019 à 2023 : 2 400 patients. Exclus : moins de 3 dosages."],["Avec quoi ? Les prédicteurs","Les données fournies à l'outil, connues au moment où il répond","Les 3 derniers dosages, la dose, le poids, l'hématocrite, les médicaments associés."],["Quoi ? Le critère prédit","L'événement à prévoir, sa définition, qui l'a mesuré","Concentration résiduelle supérieure à 10 ng/mL à la visite suivante (cible illustrative)."],["Quand ? Le moment","L'instant de la prédiction et le délai jusqu'à l'événement","Le jour de la visite, pour la visite suivante, 2 à 6 semaines plus tard."]])}
<p>Si l'étude ne répond pas à l'une de ces questions, on ne peut pas juger sa performance.</p>
${exo({t:"Lire un résumé avec les quatre questions",s:["Lisez le résumé ci-dessous.","Pour chacune des quatre questions, notez ce que dit le résumé et ce qui manque.","Écrivez une question à poser aux auteurs."],d:"3 minutes",m:"papier et crayon",p:"la grille remplie et une question aux auteurs",
 w:`<blockquote class="doc"><p class="k">Résumé fictif, rédigé pour l'exercice</p><p>« Nous avons développé un modèle d'apprentissage profond qui prédit le risque d'hospitalisation pour hémorragie chez les patients sous anticoagulant oral. Données de dispensation de 12 000 patients d'un réseau de pharmacies, de 2018 à 2022. AUC : 0,91. Le modèle surpasse les scores cliniques existants. »</p></blockquote>`,
 c:tb(["Question","Écrit dans le résumé","Absent"],[["Population","12 000 patients d'un réseau de pharmacies, 2018 à 2022","Âge, indication, exclusions"],["Prédicteurs","« Données de dispensation »","La liste, et leur date"],["Critère prédit","Hospitalisation pour hémorragie","Qui l'a codée, et comment"],["Moment","Rien","Délai entre prédiction et événement"]])+`<p>Le chiffre de performance arrive en dernier : on lit d'abord la question et les données. Une question possible aux auteurs : « Quel délai sépare la prédiction de l'hospitalisation, et le modèle a-t-il été testé dans un autre réseau de pharmacies ? »</p>`})}
</section>
<section><h2>Trois niveaux de validation</h2>
${poll("« AUC 0,86, validé sur 2 400 patients ». De quelle validation s'agit-il ?",["Interne","Temporelle","Externe"],0,"Rien n'indique d'autres patients que ceux du CHU A : c'est au mieux une validation interne.")}
${tb(["Niveau","Données de test","Ce que cela prouve"],[["Interne","Mêmes patients, tirés au sort","Le modèle a appris quelque chose"],["Temporelle","Même centre, patients plus récents","Il tient quand les pratiques évoluent"],["Externe","Autre centre, autres équipes","Il fonctionne ailleurs que chez ses auteurs"]])}
<p>« Validé » ne veut rien dire tant qu'on ne sait pas sur quelles données. Une baisse de performance en validation externe est la règle, pour quatre raisons :</p>
${ul(["<b>Les patients diffèrent</b> : âge, ancienneté de la greffe, traitements associés.","<b>Les pratiques diffèrent</b> : rythme des dosages, protocoles d'immunosuppression.","<b>La mesure diffère</b> : deux techniques de dosage du tacrolimus ne donnent pas exactement le même résultat.","<b>Le temps passe</b> : les pratiques de 2019 ne sont plus celles d'aujourd'hui."])}
${real}<h3>Un modèle de détection du sepsis, vérifié ailleurs</h3>
<p>Un outil intégré à un dossier patient informatisé, utilisé dans des centaines d'hôpitaux américains, a été évalué par une équipe indépendante sur 38 455 hospitalisations.</p>
${nums([["0,76 à 0,83","AUC annoncée par l'éditeur"],["0,63","AUC mesurée par l'équipe indépendante",1],["2 sur 3","sepsis non détectés par l'outil",1]],"Source : Wong et al., JAMA Internal Medicine, 2021.")}
</section>
<section><h2>La fuite de données</h2>
<p>Il y a fuite quand, pendant l'apprentissage, le modèle a eu accès à la réponse. Il obtient alors d'excellents résultats au test, et de mauvais résultats avec de vrais patients. Trois formes classiques :</p>
<ol class="num-list"><li><b>Le même patient des deux côtés.</b> Ses visites sont réparties entre apprentissage et test : le modèle le reconnaît.</li><li><b>Une information venue du futur.</b> Une variable enregistrée après l'événement, et qui le trahit.</li><li><b>Un indice qui n'est pas la maladie.</b> Le modèle repère l'hôpital ou l'appareil, pas l'état du patient. Des modèles de radiographie thoracique ont ainsi appris à reconnaître l'hôpital d'origine des clichés (Zech et al., 2018).</li></ol>
${fig("Six patients, six visites chacun : partager par visite, ou par patient ?",w("leak"))}
<p>Le partage se fait toujours par patient. Et pour chaque variable, un seul test : cette information existe-t-elle au moment où l'outil doit répondre ?</p>
${exo({t:"Chasse à la fuite dans TacroAlerte",s:["L'outil reçoit huit variables pour chaque visite. Le partage des données est décrit ainsi : « 31 000 visites réparties au hasard, 80 % pour l'apprentissage, 20 % pour le test ».","Pour chaque variable : est-elle connue le jour de la visite ? Répondez ci-dessous.","Repérez le défaut du partage.","Prévoyez l'effet sur l'AUC annoncée : hausse ou baisse après correction ?"],d:"5 minutes",m:"papier et crayon",p:"les variables à retirer et une phrase de justification",w:w("sorter"),
 c:tb(["Élément","Connu le jour de la visite ?","Verdict"],[["Dose prescrite à la visite suivante","Non : décidée après le résultat","Fuite : à retirer"],["Mention « surdosage » du compte rendu","Non : rédigée après le dosage","Fuite : à retirer"],["Partage au hasard des 31 000 visites","Un même patient des deux côtés","À refaire par patient"],["Les six autres variables","Oui","À conserver"]])+`<p>Pourquoi la dose de la visite suivante est une fuite, dans l'ordre du calendrier :</p>${steps([["Jour de la visite","L'outil doit prédire, avec ce qui est connu ce jour-là."],["Deux jours après","Le dosage revient : 14 ng/mL, au-dessus de la cible."],["Le médecin réagit","Il baisse la dose pour la visite suivante."],["Dans la base","Sur la ligne de la visite, on enregistre : « dose suivante : baissée »."]])}<p>Donnée au modèle, cette variable contient déjà la réponse : il lit la décision du médecin, il ne prévoit rien. Après correction, l'AUC baisse.</p>`})}
</section>
<section><h2>TacroAlerte, une fois les erreurs corrigées</h2>
<p>AUC selon les données de test, sur une échelle de 0 à 1. Chiffres fictifs, construits pour le cours.</p>
${hbars([["Annoncée par l'éditeur",0.86],["Sans fuite, test interne",0.78],["Validation externe, CHU B",0.71,1]])}
<p>Le chiffre honnête est celui mesuré sans fuite, sur des patients d'un autre centre.</p>
</section>
${cmp([["« 2 400 patients, c'est beaucoup, donc c'est fiable. »","La taille ne dit rien de la diversité : un seul centre reste un seul centre."],["« L'outil est validé. »","Validé sur quelles données : internes, plus récentes, ou d'un autre centre ?"],["« L'AUC est de 0,86. »","Mesurée comment ? Avec quel partage, et quelles variables ?"]])}
${quiz([["Un modèle est testé sur des patients du même hôpital, admis l'année suivante. C'est une validation…",["interne","temporelle","externe"],1,"Même centre, patients plus récents : c'est une validation temporelle."],["Parmi ces variables, laquelle est une fuite pour prédire un surdosage à la prochaine visite ?",["Le poids du patient","La dose prescrite après cette visite","Les trois derniers dosages"],1,"La dose prescrite après la visite est décidée une fois le résultat connu : elle trahit la réponse."],["« Validé sur 10 000 patients » vous renseigne sur…",["la taille de l'échantillon, rien de plus","la qualité de l'outil","sa performance dans votre service"],0,"La taille ne dit rien de la diversité des patients, ni de la performance chez vous."]])}
${ret(["Lire d'abord la question et les données ; le chiffre de performance vient en dernier.","Demander le niveau de validation : interne, temporelle ou externe.","Pour chaque variable : était-elle connue au moment de la prédiction ?"],"Mesurer la performance. Que signifie une AUC de 0,71 en nombre d'alertes justes et fausses ? Prévoyez une calculatrice.")}
${ficheBlk(1)}${srcs([SRC.wong,SRC.zech])}${pager(1)}</div>`;}

function s2(){return `<div class="page">${head(2,"Sensibilité, valeur prédictive, seuil : traduire un chiffre de performance en alertes justes et en alertes fausses.")}
${situ(["Le CHU B a testé TacroAlerte pendant six mois, sur <b>1 000 visites</b> de patients greffés.","L'éditeur résume le résultat ainsi : « L'outil a raison dans 76 % des cas. »","Le pharmacien responsable hésite : l'équipe devra traiter chaque alerte."],"76 % de bonnes réponses : est-ce suffisant pour l'utiliser ?")}
<section style="max-width:none"><h2>Quatre cas possibles pour chaque visite</h2>
<p>Pour chaque visite, deux questions : le patient a-t-il été surexposé ? L'outil a-t-il alerté ? Chaque visite tombe dans une case et une seule. Au départ, le simulateur montre les 1 000 visites du CHU B, avec une alerte à partir de 30 % de risque. Changez le seuil, puis la fréquence de la surexposition.</p>
${fig("Le simulateur : 1 000 visites, un outil, un seuil",w("sim"))}
${tb(["Mesure","La question","Au CHU B, seuil 30 %"],[["Sensibilité","Parmi les surexposés, combien sont alertés ?","160 / 200 = 80 %"],["Spécificité","Parmi les autres, combien sont laissés tranquilles ?","600 / 800 = 75 %"],["VPP","Quand l'outil alerte, a-t-il raison ?","160 / 360 = 44 %"],["VPN","Quand il se tait, a-t-il raison ?","600 / 640 = 94 %"]])}
<p>Sensibilité et spécificité se lisent en partant de l'état réel du patient ; VPP et VPN, en partant de ce que l'outil a dit. C'est la VPP qui intéresse l'équipe : au CHU B, plus d'une alerte sur deux est fausse.</p>
${stmt("Sensibilité et spécificité décrivent l'outil. VPP et VPN décrivent l'outil dans une population.")}
</section>
<section><h2>Le rôle de la fréquence</h2>
${poll("Même outil, mais chez des patients stables : la surexposition y est quatre fois plus rare. La VPP…",["reste à 44 %","augmente","chute"],2,"Elle chute. De combien ? C'est ce que vous allez calculer, puis vérifier avec le simulateur.")}
${exo({t:"Le même outil chez des patients stables",s:["Population : 2 000 visites de patients greffés depuis plus d'un an. La surexposition y est rare : 5 % des visites.","L'outil garde sa sensibilité (80 %) et sa spécificité (75 %).","Remplissez la matrice de confusion.","Calculez la VPP et la VPN, puis vérifiez vos réponses ci-dessous."],d:"5 minutes",m:"papier, crayon, calculatrice",p:"la matrice remplie, la VPP et la VPN",w:w("chk2"),
 c:tb(["","Surexposition","Pas de surexposition","Total"],[["Alerte","80","475","555"],["Pas d'alerte","20","1 425","1 445"],["Total","100","1 900","2 000"]])+`<p>VPP = 80 / 555 = 14 %. VPN = 1 425 / 1 445 = 98,6 %. Même outil, même seuil : quand l'outil sonne, il se trompe environ six fois sur sept. Erreur fréquente : appliquer 75 % aux 2 000 visites au lieu des 1 900 sans surexposition.</p>`})}
<p>La VPP suit la fréquence de l'événement. Avec une sensibilité de 80 % et une spécificité de 75 %, elle vaut 68 % quand 40 % des visites sont suivies d'une surexposition, 44 % à 20 %, 26 % à 10 %, 14 % à 5 % et 3 % à 1 %. Un outil se juge donc dans la population où il sera utilisé.</p>
</section>
<section><h2>Que vaut « 76 % de bonnes réponses » ?</h2>
${nums([["76 %","Exactitude de TacroAlerte au CHU B"],["80 %","Exactitude d'un outil qui n'alerte jamais",1]])}
<p>Au CHU B, 80 % des visites se passent sans surexposition. Un outil muet a donc raison 800 fois sur 1 000, sans rien détecter. L'exactitude seule ne renseigne pas quand l'événement est minoritaire.</p>
</section>
<section><h2>Le seuil d'alerte</h2>
<p>TacroAlerte calcule un risque entre 0 et 100 % pour chaque visite. Quelqu'un a décidé : « alerte à partir de 30 % ». C'est un réglage. Le baisser repère plus de surexpositions et produit plus de fausses alertes ; le monter fait l'inverse.</p>
${tb(["Seuil","Sensibilité","Spécificité","Alertes","Manquées","VPP"],[["10 %","95 %","45 %","630","10","30 %"],["30 %","80 %","75 %","360","40","44 %"],["50 %","55 %","90 %","190","90","58 %"],["70 %","30 %","97 %","84","140","71 %"]],{hl:1})}
<p class="cap">Pour 1 000 visites au CHU B, dont 200 surexpositions. Aucune ligne n'est « la bonne » : chacune répartit autrement les erreurs.</p>
<h3>L'AUC</h3>
<p>L'AUC résume tous les seuils en un chiffre : c'est la probabilité qu'un patient surexposé reçoive un score plus élevé qu'un patient qui ne l'est pas. À 0,5, l'outil classe au hasard ; à 1, il classe parfaitement. Elle ne dit ni quel seuil choisir, ni combien d'alertes seront fausses chez vos patients, ni si les risques affichés sont justes.</p>
<h3>Que coûte chaque erreur ?</h3>
${cols([["Faux négatif","Surexposition non repérée : le patient reste trop dosé jusqu'à la visite suivante, avec un risque de toxicité rénale et neurologique."],["Faux positif","Une alerte pour rien : un dosage ou un appel de plus. Répétées, les fausses alertes fatiguent l'équipe, qui finit par ne plus les lire."]])}
${exo({t:"Choisir un seuil pour deux services",s:["Service A : trois premiers mois après la greffe, un pharmacien dédié, dosages faciles à ajouter.","Service B : 600 patients stables suivis à distance par une seule infirmière de coordination.","Avec le tableau des quatre seuils, proposez un seuil pour chaque service.","Justifiez en une phrase : quelle erreur acceptez-vous, et pourquoi ?"],d:"3 minutes",m:"le tableau des quatre seuils",p:"deux seuils et deux phrases de justification",
 c:cols([["Service A : seuil bas, 10 à 30 %","Une surexposition précoce coûte cher et l'équipe peut absorber les alertes. On accepte des fausses alertes."],["Service B : seuil haut, 50 %","Une infirmière ne peut pas traiter des centaines d'alertes, et l'événement est rare. On accepte d'en manquer, avec un dosage systématique en filet de sécurité."]])+`<p>D'autres réponses sont recevables si elles s'appuient sur le coût des erreurs et les moyens de l'équipe. Un seuil se choisit pour un usage, se documente, et se réexamine.</p>`})}
<p><b>Pour aller plus loin.</b> Recalculez la VPP au seuil de 50 % chez les patients stables : 5 % de surexpositions, 2 000 visites.</p>
${reveal("Voir la réponse",`<p>55 vrais positifs et 190 faux positifs : VPP = 55 / 245 = 22 %. Vérifiez avec le simulateur, au seuil de 50 % et à 5 % de surexpositions.</p>`)}
</section>
<section><h2>Retour sur le modèle de sepsis de la séance 1</h2>${real}
<p>Validation externe sur 38 455 hospitalisations, avec un sepsis dans 7 % d'entre elles.</p>
${nums([["33 %","Sensibilité : 2 sepsis sur 3 ne déclenchent pas d'alerte",1],["12 %","VPP : environ 7 alertes sur 8 sont fausses",1],["18 %","des patients hospitalisés reçoivent une alerte"]],"Source : Wong et al., JAMA Internal Medicine, 2021.")}
<p>Avec un événement peu fréquent, une VPP basse était prévisible : c'est le calcul de l'exercice sur les patients stables.</p>
</section>
${cmp([["« L'outil détecte 80 % des cas, donc une alerte est fiable à 80 %. »","C'est confondre sensibilité et VPP. Ici, la VPP est de 44 %."],["« AUC élevée, donc outil utile. »","L'AUC ne dit ni le seuil ni le nombre de fausses alertes."],["« On a choisi le seuil qui donnait le meilleur résultat sur le test. »","Le résultat est alors trop optimiste : le seuil se fixe avant."]])}
${quiz([["Sur 50 alertes, 10 correspondent à une vraie surexposition. La VPP vaut…",["20 %","80 %","on ne peut pas savoir"],0,"10 / 50 = 20 %."],["On utilise le même outil dans un service où l'événement est plus rare. La VPP…",["augmente","ne change pas","diminue"],2,"Moins d'événements : il y a plus de fausses alertes pour chaque vraie."],["On relève le seuil d'alerte de 30 % à 50 %. On obtient…",["plus d'alertes","moins d'alertes et plus de cas manqués","une meilleure AUC"],1,"Moins d'alertes, plus de cas manqués. L'AUC, elle, ne dépend pas du seuil."]])}
${ret(["Toujours demander les deux types d'erreurs : cas manqués et fausses alertes.","La VPP dépend de la fréquence de l'événement chez vos patients.","Le seuil est un choix, qui se justifie par le coût des erreurs."],"Biais et équité. L'outil détecte 80 % des surexpositions en moyenne : est-ce vrai pour tous les patients ?")}
${ficheBlk(2)}${srcs([SRC.wong])}${pager(2)}</div>`;}

${poll("TacroAlerte repère 80 % des surexpositions. Chez les patients de 65 ans et plus, ce sera…",["80 % aussi","impossible à dire sans compter","forcément moins"],1,"Une moyenne ne dit rien d'un sous-groupe. Comptons.")}
${tb(["Groupe","Visites","Surexpositions","Alertées","Sensibilité"],[["Moins de 65 ans","700","130","118","91 %"],["65 ans et plus","300","70","42","60 %"],["Ensemble","1 000","200","160","80 %"]])}

<p>Un pourcentage calculé sur peu de cas est incertain. L'intervalle de confiance à 95 % montre cette incertitude. Faites varier le nombre de cas chez les 65 ans et plus, à sensibilité observée égale.</p>
${fig("Sensibilité mesurée (le point) et intervalle de confiance à 95 % (le trait)",w("ci"))}
<p>Trois réflexes devant un résultat par sous-groupe :</p>
${ul(["<b>L'effectif</b> : combien d'événements dans le groupe ?","<b>L'intervalle</b> : l'écart dépasse-t-il l'incertitude ?","<b>La plausibilité</b> : existe-t-il une raison clinique ou pharmacologique ?"])}
</section>
<section><h2>Quatre sources de biais</h2>
${tb(["Source","Ce qui se passe"],[["Représentation","Un groupe est rare ou absent des données d'apprentissage."],["Mesure","L'instrument est moins exact pour certains patients."],["Critère de substitution","On prédit autre chose que ce qu'on veut, faute de mieux."],["Usage","L'outil sert à des patients ou à une tâche non prévus."]])}
<p>Un biais vient presque toujours des données ou de l'usage, rarement du calcul.</p>
${real}<h3>Prédire les dépenses à la place des besoins</h3>
<p>Un algorithme américain désignait les patients à inscrire dans un programme de suivi renforcé. Il prédisait leurs dépenses de santé, et non leur état de santé. Or, à besoin égal, on dépensait moins pour les patients noirs.</p>
${nums([["17,7 %","des patients désignés par l'algorithme étaient noirs"],["46,5 %","l'auraient été si l'on avait prédit l'état de santé",1]],"Source : Obermeyer et al., Science, 2019.")}
${real}<h3>L'oxymètre de pouls</h3>
<p>Il surestime la saturation chez les patients à peau foncée : les hypoxémies non détectées y sont environ trois fois plus fréquentes, 11,7 % contre 3,6 % (Sjoding et al., 2020). Un biais de mesure se transmet à tous les outils qui utilisent la mesure.</p>
<h3>CYP3A5 et tacrolimus</h3>
<p>Les patients qui expriment CYP3A5 éliminent plus vite le tacrolimus. Leur proportion varie selon l'origine géographique des populations : un outil appris sur une population peut mal servir une autre.</p>
${exo({t:"Nommer la source du biais",s:["Lisez les quatre situations.","Pour chacune, choisissez la source principale du biais.","Justifiez en une phrase."],d:"5 minutes",m:"papier et crayon",p:"une source par situation, avec une phrase d'explication",w:w("match"),

<section><h2>D'où vient l'écart de TacroAlerte ?</h2>
${tb(["","CHU A (apprentissage)","CHU B (utilisation)"],[["Patients de 65 ans et plus","8 %, soit 192 patients sur 2 400","30 % des visites"],["Médicaments associés par patient","4 en moyenne","7 en moyenne chez les plus âgés"],["Performance vérifiée par âge","Non","Oui, par l'équipe du CHU B"]])}

${ul(["Même <b>sensibilité</b> : on manque autant de cas dans chaque groupe.","Même <b>VPP</b> : une alerte a la même valeur dans chaque groupe.","Même <b>calibration</b> : un risque de 30 % veut dire 30 % pour tous."])}

</section>
${cmp([["« Nous n'utilisons ni l'âge ni l'origine : l'outil ne peut pas être biaisé. »","Le biais vient des données et du critère prédit, pas seulement des variables."],["« 80 % de sensibilité, c'est valable pour tout le monde. »","C'est une moyenne : demander le résultat par sous-groupe."],["« On a trouvé un écart dans un groupe de 12 patients. »","Regarder l'intervalle de confiance avant de conclure."]])}

${ret(["Demander les résultats par sous-groupe, avec les effectifs.","Chercher la source : représentation, mesure, critère de substitution, usage.","Écrire les limites de l'outil dans la procédure du service."],"Incertitude et calibration. Quand TacroAlerte affiche « 70 % de risque », que veut dire ce chiffre, et peut-on le croire ?")}

function calSVG(P,aria){const X=v=>50+v*3.4,Y=v=>360-v*3.4;let g="";[0,25,50,75,100].forEach(v=>{g+=`<line x1="${X(0)}" y1="${Y(v)}" x2="${X(100)}" y2="${Y(v)}" class="gl"/><line x1="${X(v)}" y1="${Y(0)}" x2="${X(v)}" y2="${Y(100)}" class="gl"/>`;});[0,50,100].forEach(v=>{g+=`<text x="${X(v)}" y="382" class="tk" text-anchor="middle">${v} %</text><text x="42" y="${Y(v)+5}" class="tk" text-anchor="end">${v} %</text>`;});
 return `<svg viewBox="0 0 410 410" style="max-width:410px" role="img" aria-label="${aria}">${g}<line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(100)}" class="dg"/><text x="${X(100)}" y="${Y(100)-8}" class="tk" text-anchor="end">calibration parfaite</text><polyline points="${P.map(([a,o])=>`${X(a)},${Y(o)}`).join(" ")}" class="cl"/>${P.map(([a,o])=>`<circle cx="${X(a)}" cy="${Y(o)}" r="8" class="cpt"/>`).join("")}<text x="${X(50)}" y="404" class="ax" text-anchor="middle">Risque annoncé</text><text x="${X(0)}" y="12" class="ax">Fréquence observée</text></svg>`;}

${situ(["M. L., 58 ans, greffé depuis sept mois. Aujourd'hui, TacroAlerte affiche : <b>risque de surexposition à la prochaine visite, 70 %</b>.","Le néphrologue vous appelle : « 70 %, c'est beaucoup. Je baisse la dose tout de suite ? »","Vous savez classer les patients avec cet outil. Mais le chiffre lui-même ?"],"Que signifie « 70 % », et ce chiffre est-il juste ?")}
<section style="max-width:none"><h2>Annoncé contre observé</h2>
${poll("L'outil annonce 70 % de risque pour M. L. Cela veut dire…",["que M. L. sera surexposé à 70 %","que sur 100 patients comme lui, environ 70 le seront","que l'outil est fiable à 70 %"],1,"On ne peut pas le vérifier sur un patient. On le vérifie sur un groupe : c'est la calibration.")}
<div style="max-width:900px">${tb(["Risque annoncé","Visites","Moyenne annoncée","Surexpositions","Fréquence observée"],[["Moins de 10 %","370","5 %","10","3 %"],["10 à 30 %","270","19 %","30","11 %"],["30 à 50 %","170","40 %","50","29 %"],["50 à 70 %","106","60 %","50","47 %"],["70 % et plus","84","85 %","60","71 %"]])}</div>
<p class="cap">Les 1 000 visites du CHU B, rangées par tranche de risque annoncé.</p>
${fig("Le diagramme de calibration de TacroAlerte au CHU B",w("calib"))}
<p>Sur la diagonale, le chiffre annoncé est juste. Sous la diagonale, l'outil surestime le risque ; au-dessus, il le sous-estime. Ici, tous les points sont sous la diagonale.</p>
<h3>Pourquoi TacroAlerte surestime au CHU B</h3>
${nums([["27 %","Risque moyen annoncé au CHU B : c'est la fréquence réelle au CHU A, où l'outil a appris"],["20 %","Fréquence réellement observée au CHU B",1]])}
<p>Le modèle a appris la fréquence de l'hôpital où il a été construit. Un outil peut bien classer les patients et se tromper sur les chiffres.</p>
<div style="max-width:900px">${cols([["Classer : la discrimination","Donner un score plus élevé aux patients qui feront l'événement. Se mesure par l'AUC (séance 2)."],["Chiffrer : la calibration","Annoncer des risques qui correspondent aux fréquences observées. Se lit sur le diagramme."]])}</div>
<p>Dès qu'on décide à partir du chiffre affiché, la calibration devient indispensable.</p>
${exo({t:"Lire la calibration d'un autre hôpital",s:["Au CHU C, les risques annoncés de 10, 30, 50, 70 et 90 % correspondent à 22, 41, 58, 69 et 74 % de surexpositions observées.","Tracez deux axes de 0 à 100 % sur une feuille et placez les cinq points.","Où l'outil sous-estime-t-il ? Où surestime-t-il ?","Le service applique la règle « baisser la dose à partir de 50 % ». Quels patients sont mal servis ?"],d:"5 minutes",m:"une feuille, une règle",p:"le diagramme complété et deux phrases de lecture",
 c:calSVG([[10,22],[30,41],[50,58],[70,69],[90,74]],"Diagramme de calibration au CHU C : la courbe coupe la diagonale")+ul(["À gauche, au-dessus de la diagonale : l'outil <b>rassure à tort</b>.","À droite, en dessous : il <b>alarme trop</b>.","Autour de 70 % : il est juste."])+`<p>Le sens de l'erreur change avec le niveau de risque. Avec la règle « baisser la dose à partir de 50 % », les patients annoncés sous ce seuil sont mal servis : leur risque réel est plus élevé que ce que l'outil affiche.</p>`})}
<h3>Le recalibrage local</h3>
<p>On garde le classement de l'outil, et on corrige ses chiffres avec les données du service. Dans le diagramme ci-dessus, le bouton « Après recalibrage » montre le résultat : les points rejoignent la diagonale, l'ordre des patients ne change pas.</p>
${steps([["Recueillir","Quelques centaines de visites : score et résultat."],["Comparer","Annoncé contre observé, par tranche."],["Ajuster","Une correction calculée avec l'éditeur ou un biostatisticien."],["Revérifier","Chaque année, et après tout changement de pratique."]])}
<p>Recalibrer suppose d'avoir d'abord observé l'outil sans lui obéir.</p>
</section>
<section><h2>Quand l'outil ne sait pas</h2>
${cols([["Variabilité du patient","Le hasard qui reste. À dose égale, la concentration fluctue : horaire de prise, alimentation, épisode digestif. Plus de données n'y changent rien."],["Ignorance du modèle","Ce que l'outil n'a pas vu : un patient qui ne ressemble pas à ceux de l'apprentissage. Des données supplémentaires peuvent la réduire."]])}
<p>La seconde est la plus dangereuse : l'outil répond quand même, avec la même assurance. Il devrait s'abstenir pour :</p>
${ul(["un enfant, une femme enceinte ;","un patient avec moins de trois dosages, exclu de l'apprentissage (séance 1) ;","un médicament inhibiteur ou inducteur enzymatique tout juste introduit ;","des données manquantes ou aberrantes en entrée."])}
${fig("Deux patients, la même prévision",w("iv"),"Concentration prévue à la prochaine visite, avec son intervalle à 90 %. La bande bleue est la zone cible.")}
${exo({t:"Vérifier des intervalles, puis parler au médecin",s:["L'outil a fourni 200 prévisions avec un intervalle à 90 %. La concentration mesurée est tombée dans l'intervalle 162 fois.","Calculez le taux de couverture. Les intervalles sont-ils trop larges, ou trop étroits ?","Revenez à M. L. : rédigez en deux phrases votre réponse au néphrologue sur le « 70 % »."],d:"5 minutes",m:"papier, crayon, calculatrice",p:"le calcul commenté et la réponse au médecin",w:w("cov"),
 c:`<p>162 / 200 = 81 %, au lieu des 90 % annoncés : les intervalles sont trop étroits, l'outil est trop sûr de lui.</p><blockquote class="doc"><p class="k">Réponse possible au néphrologue</p><p>« Chez nous, quand l'outil annonce 70 % ou plus, la surexposition se confirme environ 7 fois sur 10. Le risque est réel, mais l'outil a tendance à exagérer : je propose un dosage anticipé cette semaine avant de modifier la dose. »</p></blockquote>`})}
</section>
${cmp([["« L'AUC est bonne, donc les pourcentages sont fiables. »","Classer et chiffrer sont deux qualités distinctes : demander la calibration."],["« L'outil dit 90 %, il est donc sûr de lui. »","Un risque élevé n'est pas une certitude sur la qualité de la prévision."],["« Il a donné un chiffre, donc il sait. »","Il répond toujours, même pour un patient qu'il n'a jamais rencontré."]])}
${quiz([["Parmi 200 patients à qui l'outil annonce 20 % de risque, 80 font l'événement. L'outil…",["est bien calibré","sous-estime le risque","surestime le risque"],1,"80 sur 200, c'est 40 %, pour 20 % annoncés : l'outil sous-estime."],["On double tous les risques affichés. L'AUC…",["double","ne change pas","diminue"],1,"L'AUC dépend du classement des patients, que le doublement ne change pas."],["L'outil n'a jamais vu de patient sous un nouvel antifongique. C'est une incertitude…",["liée à la variabilité du patient","liée à l'ignorance du modèle","sans importance"],1,"Ce patient ne ressemble à aucun de ceux de l'apprentissage."]])}
${ret(["Un pourcentage se vérifie sur un groupe : annoncé contre observé.","Bien classer ne garantit pas des chiffres justes : recalibrer localement.","Savoir pour quels patients l'outil n'a pas été construit."],"IA générative et information sur le médicament. Un patient arrive au comptoir avec la réponse d'un assistant conversationnel sur son traitement.")}
${ficheBlk(4)}${srcs([],"Tous les chiffres de cette séance sont ceux de l'outil fictif TacroAlerte.")}${pager(4)}</div>`;}

/* ---------- Séance 5 ---------- */
function s5(){return `<div class="page">${head(5,"Un patient arrive avec la réponse d'un assistant conversationnel sur son traitement. Comprendre d'où vient cette réponse, la vérifier, et répondre au patient.")}
${situ(["M. R., 54 ans, greffé du rein depuis deux ans, prend du tacrolimus. Il se sent abattu depuis quelques semaines.","Il a demandé à un assistant conversationnel s'il pouvait prendre du <b>millepertuis</b>.","Il vous tend son téléphone : « Il dit que c'est possible. Vous m'en donnez une boîte ? »"],"Comment vérifier cette réponse, et que dire à M. R. ?")}
<section style="max-width:none"><h2>Comment un modèle de langage écrit</h2>
${poll("Quand un assistant conversationnel répond à une question sur un médicament, il…",["consulte une base officielle","calcule la suite de mots la plus probable","recopie un texte trouvé en ligne"],1,"Sauf s'il a été relié à des sources, il ne consulte rien : il écrit.")}
${steps([["Découper","La question est coupée en fragments de mots."],["Prédire","Il calcule le fragment suivant le plus probable."],["Répéter","Fragment après fragment, jusqu'à la fin."],["Afficher","Un texte fluide, au ton assuré."]])}
<p style="max-width:720px">Il a appris ces probabilités sur une très grande quantité de textes. À aucune étape il ne consulte une source, sauf si on l'y a relié.</p>
${fig("Faites écrire le modèle",w("gen"),"Probabilités inventées pour l'illustration. Le principe est réel : après « peut », augmenter et diminuer se disent presque aussi souvent.")}
${stmt("Un modèle de langage écrit ce qui est plausible. Il ne vérifie pas ce qui est vrai.")}
<p style="max-width:720px">Son ton est le même quand il a raison et quand il se trompe.</p>
<h3>Quatre erreurs typiques</h3>
<div style="max-width:900px">${tb(["Erreur","Exemple"],[["Fait faux ou inversé","Le sens d'une interaction, une dose, une unité."],["Référence inventée","Un titre et une date crédibles, pour un document qui n'existe pas."],["Omission","Tout est exact, mais la contre-indication n'est pas mentionnée."],["Information périmée","Le modèle ignore ce qui a changé depuis son entraînement."]])}</div>
<p style="max-width:720px">Les trois premières ne se voient pas à la lecture : il faut vérifier.</p>
</section>
<section><h2>Vérifier la réponse de M. R.</h2>
<blockquote class="doc"><p class="k">La réponse montrée par M. R., fictive, rédigée pour l'exercice</p><p>« Le millepertuis est une plante naturelle, généralement bien tolérée. Il peut augmenter légèrement le taux de tacrolimus : il suffit d'espacer les deux prises de deux heures. Source : ANSM, Bulletin de pharmacovigilance n° 47, 2021. »</p></blockquote>
${exo({t:"Vérifier la réponse, affirmation par affirmation",s:["Découpez la réponse en affirmations vérifiables : il y en a quatre.","Pour chacune : juste, fausse, ou invérifiable ? Répondez ci-dessous.","Notez la source dans laquelle vous avez vérifié.","Qu'est-ce qui manque dans cette réponse ?"],d:"10 minutes",m:"le Thesaurus des interactions de l'ANSM, en ligne",p:"un tableau à quatre lignes et la mention manquante",w:w("claims"),
 c:tb(["Affirmation","Verdict","Où vérifier"],[["« Plante bien tolérée »","Trompeur : inducteur enzymatique puissant","Thesaurus, RCP"],["« Augmente le taux de tacrolimus »","Faux : il le diminue","Thesaurus"],["« Espacer de deux heures »","Faux : l'induction dure des jours","Thesaurus, RCP"],["« Bulletin n° 47, 2021 »","Référence introuvable","Site de l'ANSM"]])+`<p><b>Ce qui manque :</b> l'association est contre-indiquée, avec un risque de rejet du greffon.</p>`})}
<h3>Vérifier en quatre étapes</h3>
${steps([["Isoler","Chaque affirmation vérifiable, une par une."],["Vérifier","Dans une source de référence, pas en reposant la question."],["Ouvrir","La référence citée existe-t-elle ? Dit-elle cela ?"],["Compléter","Que manque-t-il : contre-indication, conduite à tenir ?"]])}
<p>Reposer la question n'est pas vérifier.</p>
<h3>Où vérifier une information sur un médicament</h3>
${tb(["Source","Ce qu'on y trouve","Produite par"],[["RCP, base de données publique des médicaments","Posologie, contre-indications, interactions","Autorités de santé"],["Thesaurus des interactions médicamenteuses","Niveau de contrainte, conduite à tenir","ANSM"],["CRAT","Grossesse et allaitement","Centre de référence hospitalier"],["Recommandations de bonne pratique","Stratégie thérapeutique","HAS, sociétés savantes"]])}
<p>Une source de référence a un auteur, une date et un responsable.</p>
<h3>Tacrolimus : cinq associations à connaître</h3>
${tb(["Associé","Effet sur le tacrolimus","Risque"],[["Millepertuis","Concentration diminuée","Rejet : contre-indiqué"],["Rifampicine","Concentration diminuée","Rejet"],["Antifongiques azolés, certains macrolides","Concentration augmentée","Toxicité"],["Jus de pamplemousse","Concentration augmentée","Toxicité : à éviter"],["Anti-inflammatoires non stéroïdiens","Pas d'effet sur la concentration","Toxicité rénale additive"]])}
<p class="cap">Sens de l'effet. Le niveau de contrainte se vérifie dans le Thesaurus en vigueur.</p>
</section>
<section><h2>Au comptoir</h2>
<h3>Un assistant relié à des sources</h3>
${cols([["Ce que cela améliore","Les références existent et peuvent être ouvertes. Les réponses s'appuient sur des textes à jour."],["Ce qui reste à vérifier","Il peut mal lire le document, citer un passage hors de son contexte, ou choisir une source qui n'est pas la bonne."]])}
<p>Mieux, mais pas infaillible : la vérification reste à la charge du professionnel.</p>
<h3>À quoi s'en servir</h3>
${tb(["Raisonnable, avec relecture","À risque sans vérification"],[["Reformuler en langage simple un texte déjà vérifié","Demander une posologie ou une interaction"],["Traduire une consigne pour un patient","Demander une référence bibliographique"],["Préparer une liste de questions pour un entretien","Trancher une contre-indication"]])}
<p>L'outil travaille la forme. Le fond vient d'une source de référence.</p>
<h3>Ce que l'on ne saisit jamais</h3>
${ul(["Ni nom, ni date de naissance, ni numéro de sécurité sociale.","Aucune photographie d'ordonnance ou de compte rendu.","Décrire le cas en termes généraux : « patient greffé sous tacrolimus ».","N'utiliser que les outils autorisés par l'établissement ou l'officine."])}
${exo({t:"Répondre à M. R.",s:["M. R. insiste : « c'est naturel, ça ne peut pas faire de mal ».","Écrivez, mot pour mot, ce que vous lui répondez.","Votre réponse doit accueillir, vérifier, expliquer et proposer une conduite."],d:"5 minutes",m:"papier et crayon",p:"quatre ou cinq phrases, telles que vous les diriez",
 w:`<label class="lbl" for="t5">Votre réponse</label><textarea id="t5" placeholder="Écrivez ici, puis comparez avec la correction."></textarea>`,
 c:tb(["Geste","Une formulation possible"],[["Accueillir sans juger","« Vous avez bien fait de me montrer cette réponse. »"],["Vérifier avec le patient","« Regardons ensemble ce que dit la référence officielle. »"],["Expliquer le risque","« Le millepertuis fait baisser votre tacrolimus : le greffon est moins protégé. »"],["Conclure et orienter","« Ne le prenez pas. Parlez de votre moral à votre équipe de greffe. »"]])+`<p>Le patient repart avec une conduite claire et une réponse à sa vraie demande.</p>`})}
</section>
${cmp([["« Il cite une source officielle, donc c'est fiable. »","Ouvrir la source : existe-t-elle, et dit-elle cela ?"],["« La réponse est claire et détaillée. »","La qualité de l'écriture ne dit rien de l'exactitude."],["« J'ai reposé la question, il a confirmé. »","Ce n'est pas une vérification : il faut une source indépendante."]])}
${quiz([["Un assistant cite un article avec auteurs et année. Vous…",["considérez l'information comme vérifiée","cherchez l'article et lisez ce qu'il dit","reposez la question pour confirmer"],1,"Une référence citée se vérifie : existe-t-elle, et dit-elle cela ?"],["Millepertuis et tacrolimus : la concentration de tacrolimus…",["augmente","ne change pas","diminue, avec un risque de rejet"],2,"Le millepertuis est un inducteur enzymatique : la concentration baisse, le greffon est moins protégé."],["Quelle demande est raisonnable ?",["« Reformule ce paragraphe de notice pour un patient. »","« Quelle dose pour 70 kg ? »","« Donne-moi la référence de cette interaction. »"],0,"Reformuler un texte déjà vérifié est raisonnable ; les deux autres demandent une source de référence."]])}
${ret(["Un texte fluide et assuré n'est pas un texte vérifié.","Vérifier chaque affirmation dans une source de référence, et ouvrir les références citées.","Au comptoir : accueillir, vérifier avec le patient, conclure par une conduite claire."],"Données de santé et cadre réglementaire. Que peut-on saisir dans un outil ou envoyer à un éditeur, et qui en répond ?")}
${ficheBlk(5)}${srcs([SRC.bdpm,SRC.thes,SRC.crat])}${pager(5)}</div>`;}

function s6(){return `<div class="page">${head(6,"RGPD, dispositifs médicaux, règlement européen sur l'IA : ce qu'il faut savoir avant de confier des données à un outil ou de s'en servir.")}
${situ(["L'éditeur de TacroAlerte propose d'« améliorer le modèle » avec les données du service.","Un interne prépare un fichier : <b>nom, date de naissance et trois ans de dosages</b> pour 480 patients.","Il s'apprête à l'envoyer par courriel, depuis sa messagerie personnelle."],"Qu'est-ce qui pose problème, et comment faire correctement ?")}
<section><h2>Trois textes, trois questions</h2>
${tb(["Texte","Ce qu'il encadre","La question"],[["RGPD, 2016","Les données","Que peut-on faire des données des patients ?"],["Règlement sur les dispositifs médicaux, 2017","Le produit","L'outil est-il sûr et performant pour l'usage annoncé ?"],["Règlement sur l'IA, 2024","Le système d'IA","Est-il maîtrisé tout au long de sa vie ?"]])}
<p>Pour un outil comme TacroAlerte, les trois s'appliquent en même temps.</p>
</section>
<section style="max-width:none"><h2>Les données de santé</h2>
${poll("L'interne retire les noms du fichier avant de l'envoyer. Est-ce suffisant ?",["Oui : les données sont anonymes","Non : date de naissance et dosages identifient encore","Oui, si l'éditeur promet d'effacer"],1,"Sans le nom, on retrouve un patient greffé avec sa date de naissance et son centre.")}
${fig("Sans le nom, que reste-t-il pour retrouver une patiente ?",w("reid"),"Ordres de grandeur inventés pour l'illustration.")}
<div style="max-width:900px">${tb(["Statut","Exemple","Conséquence"],[["Directement identifiante","Nom, date de naissance, dosages","Donnée personnelle de santé"],["Pseudonymisée","Code 0417 et dosages ; la table de correspondance existe","Toujours une donnée personnelle"],["Anonyme","Moyennes par service, sans retour possible à une personne","Hors du champ du RGPD"]])}</div>
<p style="max-width:720px">Retirer le nom ne suffit pas à rendre une donnée anonyme : tant qu'on peut retrouver la personne, la donnée reste personnelle.</p>
<h3>Six principes, appliqués au fichier de dosages</h3>
<div style="max-width:900px">${tb(["Principe","Pour le fichier de l'interne"],[["Finalité","Dire à quoi serviront les données, avant de les transmettre"],["Minimisation","Ne transmettre que le nécessaire : pas le nom"],["Exactitude","Des données vérifiées et à jour"],["Durée limitée","Fixer une date de suppression chez l'éditeur"],["Sécurité","Chiffrement, accès restreints, pas de messagerie personnelle"],["Transparence","Les patients sont informés"]])}</div>
<h3>Données de santé : interdites, sauf exceptions</h3>
<p style="max-width:720px">L'article 9 du RGPD interdit en principe de traiter des données de santé. Trois exceptions sont utiles en pratique :</p>
${ul(["<b>Les soins</b>, par des professionnels tenus au secret.","<b>Le consentement explicite</b> de la personne.","<b>La recherche et la santé publique</b>, dans un cadre fixé par la loi."])}
<p style="max-width:720px">« Améliorer le produit d'un éditeur » n'entre pas dans l'exception des soins.</p>
${exo({t:"Le fichier de l'interne",s:["Relisez la situation de départ et listez tout ce qui pose problème.","Pour chaque problème, nommez le principe concerné.","Proposez une manière correcte d'atteindre le même but.","Qui, dans l'établissement, doit être consulté en premier ?"],d:"5 minutes",m:"papier et crayon",p:"un tableau : problème, principe, correction",
 c:tb(["Problème","Principe","Correction"],[["Nom et date de naissance transmis","Minimisation","Pseudonymiser ; la table reste au CHU"],["But flou : « améliorer le modèle »","Finalité","Projet décrit et validé"],["Messagerie personnelle","Sécurité","Canal sécurisé, hébergeur certifié"],["Patients non informés","Transparence","Information, droit de s'opposer"],["Décision prise seul","Responsabilité","C'est l'établissement qui décide"]])+`<p>Le circuit correct :</p>${steps([["Décrire","Le but, les données nécessaires, la durée."],["Protéger","Pseudonymiser, chiffrer, héberger chez un prestataire certifié."],["Encadrer","Un contrat avec l'éditeur, l'avis du délégué à la protection des données."],["Informer","Les patients, et tracer ce qui a été transmis."]])}<p>Premier réflexe : appeler le délégué à la protection des données.</p>`})}
</section>
<section style="max-width:none"><h2>L'outil lui-même</h2>
${stmt("Un logiciel qui aide à décider d'un traitement est un dispositif médical.")}
<p style="max-width:720px">Il doit porter le marquage CE, pour l'usage précis que son fabricant annonce. Ce qui compte est la finalité annoncée.</p>
${fig("Dispositif médical, ou non ? Répondez pour chaque logiciel",w("dm"))}
<h3>Le règlement sur l'IA : quatre niveaux de risque</h3>
${fig("Choisissez un niveau",w("pyr"))}
<h3>Un règlement appliqué par étapes</h3>
${fig("Le calendrier du règlement sur l'IA",w("tl"),"Points pleins : déjà applicable. Points vides : à venir. Source : règlement (UE) 2024/1689, modifié par le règlement (UE) 2026/1744, vérifié en novembre 2026.")}
<p style="max-width:720px">Les deux dernières dates ont été repoussées en 2026. Le marquage CE des dispositifs médicaux, lui, s'applique déjà.</p>
<h3>Qui répond de quoi ?</h3>
<div style="max-width:900px">${tb(["Acteur","Ce dont il répond"],[["L'éditeur, fabricant","Conformité, marquage CE, notice, surveillance après mise sur le marché"],["L'établissement","Usage conforme à la notice, formation, supervision, conservation des journaux"],["Le professionnel","Sa décision, l'information du patient, la traçabilité, le signalement"]])}</div>

${exo({t:"Cinq outils à situer",s:["A : rappel de prises. B : calcul de dose d'un anticoagulant. C : assistant d'accueil du site de l'officine. D : tri des candidatures à l'hôpital. E : TacroAlerte.","Pour chacun : traite-t-il des données de santé ?","Est-ce un dispositif médical ?","Quel niveau de risque au sens du règlement sur l'IA ?"],d:"5 minutes",m:"papier et crayon",p:"un tableau de cinq lignes et trois colonnes",
 c:tb(["Outil","Données de santé","Dispositif médical","Règlement sur l'IA"],[["A. Rappel de prises","Oui","En général non","Risque minimal"],["B. Calcul de dose","Oui","Oui","Haut risque s'il comporte de l'IA"],["C. Assistant d'accueil","Possible","Non","Transparence"],["D. Tri des candidatures","Non","Non","Haut risque (emploi)"],["E. TacroAlerte","Oui","Oui","Haut risque"]])})}
</section>
